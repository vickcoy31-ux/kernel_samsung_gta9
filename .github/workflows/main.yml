name: GTA9 Kernel Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: 15.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential clang lld llvm libssl-dev libelf-dev python3 cpio rsync lz4 kmod

      - name: Check source & Infrastructure
        run: |
          echo "Checking GTA9 source..."
          if [ -f arch/arm64/configs/gta9_00_defconfig ]; then
            echo "gta9_00_defconfig FOUND"
          else
            echo "gta9_00_defconfig NOT FOUND"
          fi

          if [ -f build/build.sh ]; then
            echo "build/build.sh FOUND"
          fi

          if [ -d vendor/mediatek/kernel_modules ]; then
            echo "vendor modules FOUND"
          fi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 url?id=1kdrag0n/proton-clang.git clang

      - name: Inject KernelSU Setup
        run: |
          rm -rf drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          git clone --depth=1 url?id=1tiann/KernelSU.git drivers/kernelsu
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: Start Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/clang/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          if [ -f arch/arm64/configs/gta9_00_defconfig ]; then
            make CC=clang gta9_00_defconfig
          else
            make CC=clang defconfig
          fi

          chmod +x scripts/config || true
          scripts/config --enable CONFIG_KSU || echo "CONFIG_KSU=y" >> .config
          make -j$(nproc) CC=clang Image

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta9-test-kernel
          path: arch/arm64/boot/Image
