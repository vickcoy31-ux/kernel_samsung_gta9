name: Build Kernel - AI Gemini

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 15.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl ccache rsync kmod cpio python3 lz4 lld llvm

      - name: Check Build Infrastructure & Config
        run: |
          echo "=== 1. Memeriksa keberadaan defconfig GTA9 ==="
          if [ -f arch/arm64/configs/gta9_00_defconfig ]; stream
            echo "gta9_00_defconfig DITEMUKAN!"
          else
            echo "gta9_00_defconfig TIDAK DITEMUKAN, akan memakai auto-detect..."
          fi

          echo "=== 2. Memeriksa infrastruktur vendor ==="
          if [ -f build/build.sh ]; then
            echo "build/build.sh DITEMUKAN"
          fi
          if [ -d vendor/mediatek/kernel_modules ]; then
            echo "Vendor modules MediaTek DITEMUKAN"
          fi

      - name: Download Clang Toolchain
        run: |
          echo "Mengunduh Proton-Clang Compiler..."
          git clone --depth=1 url?id=1kdrag0n/proton-clang.git clang

      - name: Inject KernelSU Clean Setup
        run: |
          echo "=== 1. Bersihkan KSU lama ==="
          rm -rf drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          
          echo "=== 2. Clone KernelSU ==="
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu
          
          echo "=== 3. Daftarkan Kconfig & Makefile ==="
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile
          
          ls -la drivers/kernelsu/Kconfig

      - name: Start Full Compilation
        run: |
          # Setup Environment Clang & Cross Compiler
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/clang/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo "=== Menentukan file config ==="
          if [ -f arch/arm64/configs/gta9_00_defconfig ]; then
            TARGET_CONFIG="gta9_00_defconfig"
          else
            CONFIG_PATH=$(find arch/arm64/configs/ -type f \( -iname "*gta9*" -o -iname "*x110*" \) | head -n 1)
            TARGET_CONFIG=$(echo "$CONFIG_PATH" | sed 's|arch/arm64/configs/||')
          fi
          
          echo "Memakai config: $TARGET_CONFIG"
          make CC=clang $TARGET_CONFIG
          
          echo "Memastikan opsi KernelSU aktif di .config..."
          chmod +x scripts/config || true
          scripts/config --enable CONFIG_KSU || echo "CONFIG_KSU=y" >> .config
          
          echo "Memproses kompilasi kernel dengan KernelSU..."
          make -j$(nproc) CC=clang Image

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samsung-x110-kernelsu-kernel
          path: arch/arm64/boot/Image
