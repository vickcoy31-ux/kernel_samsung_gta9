name: GTA9 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 15.0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            wget \
            curl \
            ccache \
            rsync \
            kmod \
            cpio \
            python3 \
            lz4

      - name: Detect GTA9 Configuration
        run: |
          echo "=== Searching GTA9 configuration ==="

          CONFIG_PATH=$(find arch/arm64/configs/ -type f \
            \( -iname "*gta9*" -o -iname "*x110*" \) \
            | head -n 1)

          if [ -n "$CONFIG_PATH" ]; then
            TARGET_CONFIG=$(echo "$CONFIG_PATH" | sed 's|arch/arm64/configs/||')
            echo "Found: $TARGET_CONFIG"
            echo "TARGET_CONFIG=$TARGET_CONFIG" >> "$GITHUB_ENV"
          else
            echo "No GTA9/X110 config found."
            echo "TARGET_CONFIG=defconfig" >> "$GITHUB_ENV"
          fi

      - name: Check Vendor Modules
        run: |
          echo "=== Checking vendor modules ==="

          if [ -d vendor/mediatek/kernel_modules ]; then
            echo "Vendor modules FOUND."
            find vendor/mediatek/kernel_modules -maxdepth 2 -type d | head -50
          else
            echo "Vendor modules NOT FOUND in repository."
          fi
