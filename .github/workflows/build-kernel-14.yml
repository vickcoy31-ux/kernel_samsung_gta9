name: Build GTA9 Kernel 14.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '14.0'
          path: master/kernel-5.10
          submodules: false

      - name: Fetch KernelSU
        run: |
          cd master/kernel-5.10
          rm -rf KernelSU
          git clone --depth 1 https://github.com/tiann/KernelSU.git KernelSU

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick liblz4-tool libncurses5-dev libssl-dev lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: Setup clang (ZyCromerZ 16.0.6)
        run: |
          mkdir -p master/prebuilts/clang/host/linux-x86/clang
          cd master/prebuilts/clang/host/linux-x86/clang
          curl -L --retry 3 -o clang.tar.gz "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
          tar -xzf clang.tar.gz --strip-components=0
          rm clang.tar.gz

      - name: Setup GCC aarch64 prebuilt
        run: |
          mkdir -p master/prebuilts/gcc/linux-x86/aarch64
          cd master/prebuilts/gcc/linux-x86/aarch64
          curl -L --retry 5 -o gcc.tar.gz "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz"
          mkdir -p aarch64-linux-android-4.9
          tar -xzf gcc.tar.gz -C aarch64-linux-android-4.9
          rm gcc.tar.gz

      - name: Setup GCC arm prebuilt
        run: |
          mkdir -p master/prebuilts/gcc/linux-x86/arm
          cd master/prebuilts/gcc/linux-x86/arm
          curl -L --retry 5 -o gcc.tar.gz "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/master.tar.gz"
          mkdir -p arm-linux-androideabi-4.9
          tar -xzf gcc.tar.gz -C arm-linux-androideabi-4.9
          rm gcc.tar.gz

      - name: Bedah Source (Force Remove SSG)
        run: |
          cd master/kernel-5.10
          # INI ADALAH KUNCI UTAMANYA: 
          # Kita hapus/rename file yang bikin error agar compiler tidak menemukannya.
          if [ -f block/ssg-iosched.c ]; then
            mv block/ssg-iosched.c block/ssg-iosched.c.bak
            echo "SSG I/O Scheduler has been disabled by renaming file."
          fi
          
          # Mematikan SSG di semua file config yang mungkin ada di source
          find . -name "*.config" -exec sed -i 's/CONFIG_IOSCHED_SSG=y/CONFIG_IOSCHED_SSG=n/g' {} +
          find . -name "*_defconfig" -exec sed -i 's/CONFIG_IOSCHED_SSG=y/CONFIG_IOSCHED_SSG=n/g' {} +

          cp -r setup/kernel ../kernel
          cp -r setup/vendor ../vendor

      - name: Build kernel
        run: |
          cd master/kernel-5.10
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$PWD/../prebuilts/clang/host/linux-x86/clang/bin:$PATH"
          
          # Kita tetap gunakan flag ini sebagai pengaman tambahan
          export KCFLAGS="-Wno-implicit-function-declaration -Wno-error=implicit-function-declaration"
          
          make O=../out gta9_00_defconfig
          
          # Pastikan SSG mati di config hasil generate
          sed -i 's/CONFIG_IOSCHED_SSG=y/CONFIG_IOSCHED_SSG=n/g' ../out/.config
          
          make O=../out -j$(nproc) Image
          
          # Cek file Image (tanpa .gz)
          test -f ../out/arch/arm64/boot/Image && echo "KERNEL OK" || { echo "KERNEL BUILD FAILED"; exit 1; }

      - name: Collect outputs
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta9-kernel-14.0
          path: artifacts/**
          if-no-files-found: warn
